<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar libro | Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

  <div class="container mt-5">
    <h2 class="mb-4">Agregar nuevo libro</h2>

    <form id="formAgregarLibro" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Autor</label>
        <input type="text" name="autor" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">ISBN</label>
        <input type="text" name="isbn" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Imagen (URL o archivo)</label>
        <input type="file" name="imgFile" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

    <div id="mensaje" class="mt-3"></div>
  </div>

<script>
document.getElementById("formAgregarLibro").addEventListener("submit", async (e) => {
  e.preventDefault();

  let datos = new FormData(e.target);

  let resp = await fetch("agregar_libro.php", {
    method: "POST",
    body: datos
  });

  let texto = await resp.text();
  document.getElementById("mensaje").innerHTML = texto;
});
</script>

</body>
</html>
