<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookFlow | Registro</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bg-dark text-white p-3 shadow-sm header-fixed">
  <div class="container d-flex justify-content-between align-items-center">
    <h3 class="m-0">BookFlow</h3>
    <a href="login.php" class="btn btn-outline-light">Iniciar sesión</a>
  </div>
</header>

<section class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card p-4 shadow-lg login-card">

        <h4 class="mb-3 text-center fw-bold">Crear Cuenta</h4>

        <form id="registerForm" method="POST" action="registro.html">

          <div class="mb-3">
            <label class="form-label fw-bold">Nombre completo</label>
            <input type="text" class="form-control form-control-lg" name="nombre" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Correo electrónico</label>
            <input type="email" class="form-control form-control-lg" name="email" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control form-control-lg" id="password" name="password" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password')">
                👁️
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Confirmar contraseña</label>
            <div class="input-group">
              <input type="password" class="form-control form-control-lg" id="password2" name="password2" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password2')">
                👁️
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-danger w-100 btn-lg mt-3">Registrarme</button>

          <p class="text-center mt-3 mb-0">
            ¿Ya tienes una cuenta?
            <a href="login.php" class="link-danger fw-semibold">Iniciar sesión</a>
          </p>

        </form>

      </div>
    </div>
  </div>
</section>

<script>
function togglePassword(id) {
  const field = document.getElementById(id);
  field.type = field.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
